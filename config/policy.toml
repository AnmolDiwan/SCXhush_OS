# scx_hush Policy Configuration
# Sections match scx_hush PRD & Architecture Section 9.2

[scheduler]
fg_slice_ms = 5
normal_slice_ms = 10
bg_slice_ms = 20
guard_ms = 2000 # must be <= watchdog_timeout / 4
boost_ms = 50
boost_cap_pct = 10

# Rule matching order: first match wins (FR-2, FR-3)
[[rule]]
match = { cgroup = "/user.slice/user-1000.slice/session-*.scope" }
class = "foreground"

[[rule]]
match = { comm = ["cc1", "cc1plus", "rustc", "ld", "restic"] }
class = "background"

[[rule]]
match = { cgroup = "/system.slice/backup.service" }
class = "background"

[[rule]]
match = { comm = ["schbench", "game", "compositor", "browser", "control_loop"] }
class = "foreground"

[[rule]]
match = { comm = ["zstd", "gzip", "tar", "vacuum", "rsync"] }
class = "background"

